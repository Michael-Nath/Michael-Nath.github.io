layout: page
title: bus map
permalink: /bus-map/
description: As a fun side quest, I'm trying to ride all the MTA bus lines. I've attached a short story for each line I've taken, please click!
nav: false
nav_order: 7
---
<div id="bus-map-root">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  #bus-map-root{
    --bronx:#E07A16;
    --manhattan:#D6293D;
    --queens:#6C4C9E;
    --brooklyn:#12799A;
    --statenisland:#1E8F55;
  }
  html[data-theme="dark"] #bus-map-root{
    --bronx:#FFA04D;
    --manhattan:#FF6B78;
    --queens:#A98CE0;
    --brooklyn:#4FC1E9;
    --statenisland:#4FD696;
  }

  /* This page needs more room than the site's normal 800px reading column. */
  .container:has(#bus-map-root){
    max-width: 1200px;
  }

  #bus-map-root{
    color: var(--global-text-color);
  }

  .bm-stats{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }
  .bm-ring-num{font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums;}
  .bm-ring-label{font-size:0.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--global-text-color-light);}

  .bm-board{
    display:grid;
    grid-template-columns:minmax(0,1fr) 320px;
    gap:20px;
  }
  @media (max-width:860px){
    .bm-board{grid-template-columns:1fr;}
  }

  .bm-map-frame{
    border:1px solid var(--global-divider-color);
    border-radius:8px;
    overflow:hidden;
    background:var(--global-card-bg-color);
  }
  #bm-map{
    height:70vh;
    min-height:440px;
    max-height:700px;
    background:var(--global-bg-color);
  }
  @media (max-width:860px){
    #bm-map{height:60vh;}
  }

  .leaflet-container{background:var(--global-bg-color) !important;}
  .bm-route-tooltip{
    font:600 12px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--global-footer-bg-color);
    color:var(--global-footer-text-color);
    border:none;
    padding:4px 8px;
    border-radius:5px;
    box-shadow:none;
  }
  .bm-route-tooltip::before{display:none;}

  .bm-sidebar{
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .bm-search{
    width:100%;
    padding:8px 11px;
    border-radius:6px;
    border:1px solid var(--global-divider-color);
    background:var(--global-card-bg-color);
    color:var(--global-text-color);
    font-size:0.9rem;
    margin-bottom:14px;
    flex-shrink:0;
  }
  .bm-search::placeholder{color:var(--global-text-color-light);}

  .bm-scroll{
    overflow-y:auto;
    max-height:70vh;
    padding-right:4px;
  }

  .bm-borough{margin-bottom:16px;}
  .bm-borough summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:7px;
  }
  .bm-borough summary::-webkit-details-marker{display:none;}
  .bm-borough[open] .bm-chev{transform:rotate(90deg);}
  .bm-chev{color:var(--global-text-color-light);font-size:10px;transition:transform .15s ease;display:inline-block;margin-right:6px;}
  .bm-name{display:flex;align-items:center;font-weight:700;font-size:0.9rem;}
  .bm-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-right:7px;}
  .bm-count{font-size:0.75rem;color:var(--global-text-color-light);font-variant-numeric:tabular-nums;}
  .bm-bar{height:3px;border-radius:2px;background:var(--global-divider-color);overflow:hidden;margin-bottom:9px;}
  .bm-bar > i{display:block;height:100%;border-radius:2px;}

  .bm-pills{display:flex;flex-wrap:wrap;gap:5px;}
  .bm-pill{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 8px 4px 5px;
    border-radius:999px;
    border:1px solid var(--global-divider-color);
    background:var(--global-card-bg-color);
    color:var(--global-text-color-light);
    font-size:0.72rem;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
    line-height:1;
  }
  .bm-pill .bm-mark{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex-shrink:0;}
  .bm-pill.sbs .bm-mark{border-radius:2px;transform:rotate(45deg);}
  .bm-pill.on{color:#fff;border-color:transparent;}
  .bm-pill.on .bm-mark{background:#fff;border-color:#fff;}
  .bm-pill.selected{box-shadow:0 0 0 2px var(--global-text-color);}
  .bm-pill.hide{display:none;}

  .bm-detail{display:none;}
  .bm-detail.show{display:block;}
  .bm-detail-back{
    background:none;border:none;padding:0;margin-bottom:10px;
    color:var(--global-text-color-light);font-size:0.78rem;
    cursor:pointer;text-decoration:underline;text-underline-offset:2px;
  }
  .bm-detail-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;margin-bottom:3px;}
  .bm-detail-ridden{
    font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    padding:2px 7px;border-radius:999px;background:var(--global-theme-color);color:#fff;
  }
  .bm-detail-sub{font-size:0.78rem;color:var(--global-text-color-light);margin:0 0 12px;}
  .bm-detail-story{
    font-size:0.84rem;
    line-height:1.55;
    color:var(--global-text-color);
    margin:0 0 14px;
    padding:10px 12px;
    background:var(--global-card-bg-color);
    border-left:2px solid var(--global-theme-color);
    border-radius:0 6px 6px 0;
    white-space:pre-line;
  }
  .bm-stop-list{list-style:none;margin:0;padding:0;}
  .bm-stop-list li{
    display:flex;align-items:baseline;gap:9px;
    padding:7px 2px;
    border-bottom:1px solid var(--global-divider-color);
    font-size:0.8rem;
    cursor:pointer;
  }
  .bm-stop-list li:hover{color:var(--global-theme-color);}
  .bm-stop-num{
    font-variant-numeric:tabular-nums;color:var(--global-text-color-light);
    font-size:0.7rem;flex-shrink:0;width:1.6em;text-align:right;
  }

</style>

<div class="bm-stats">
  <svg width="52" height="52" viewBox="0 0 52 52">
    <circle cx="26" cy="26" r="22" fill="none" stroke="var(--global-divider-color)" stroke-width="6"/>
    <circle id="bm-ring" cx="26" cy="26" r="22" fill="none" stroke="var(--global-theme-color)" stroke-width="6" stroke-linecap="round" transform="rotate(-90 26 26)" stroke-dasharray="138.2" stroke-dashoffset="138.2"/>
  </svg>
  <div>
    <div class="bm-ring-num" id="bm-fraction">0/0</div>
    <div class="bm-ring-label">Routes ridden</div>
  </div>
</div>

<div class="bm-board">
  <div class="bm-map-frame">
    <div id="bm-map"></div>
  </div>

  <aside class="bm-sidebar">
    <input class="bm-search" id="bm-search" type="text" placeholder="Search a route, e.g. &ldquo;Q44&rdquo;" autocomplete="off"/>
    <div class="bm-scroll">
      <div id="bm-borough-list"></div>
      <div id="bm-detail" class="bm-detail"></div>
    </div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function(){
  const BOROUGH_META = {
    bronx:        {name:'The Bronx',     color:'var(--bronx)'},
    manhattan:    {name:'Manhattan',     color:'var(--manhattan)'},
    queens:       {name:'Queens',        color:'var(--queens)'},
    brooklyn:     {name:'Brooklyn',      color:'var(--brooklyn)'},
    statenisland: {name:'Staten Island', color:'var(--statenisland)'},
    other:        {name:'Other',         color:'var(--global-text-color-light)'}
  };
  const ORDER = ['bronx','manhattan','queens','brooklyn','statenisland','other'];

  function norm(s){ return String(s || '').toUpperCase().replace(/[\s-]+/g,''); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const RIDDEN_RAW = {{ site.data.ridden_routes | jsonify }};
  const RIDDEN = new Set(RIDDEN_RAW.map(r => norm(r.id)));
  const STORIES = {};
  RIDDEN_RAW.forEach(r => { STORIES[norm(r.id)] = (r.story || '').trim(); });
  function storyOf(id){ return STORIES[norm(id)] || ''; }

  function isDark(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }
  function cssVar(name){ return getComputedStyle(document.getElementById('bus-map-root')).getPropertyValue(name).trim(); }

  let GHOST = cssVar('--global-text-color-light');

  const map = L.map('bm-map', {
    minZoom: 10,
    maxZoom: 17,
    maxBounds: L.latLngBounds([40.40,-74.35],[40.98,-73.60]),
    maxBoundsViscosity: 0.6
  }).setView([40.705,-73.94], 11);

  const TILE_URL = {
    light: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    dark:  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
  };
  const ATTRIB = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';
  let tileLayer = L.tileLayer(TILE_URL[isDark() ? 'dark' : 'light'], {attribution: ATTRIB, subdomains:'abcd', maxZoom:19}).addTo(map);

  const pillsByRoute = {};
  const routesById = {};

  fetch('{{ "/assets/data/bus-routes.geojson" | relative_url }}')
    .then(r => r.json())
    .then(fc => {
      fc.features.forEach(f => routesById[f.properties.id] = f);
      warnUnmatched(fc.features);
      buildMap(fc.features);
      buildSidebar(fc.features);
      updateStats(fc.features);
    });

  function warnUnmatched(features){
    const known = new Set(features.map(f => norm(f.properties.id)));
    RIDDEN_RAW.forEach(raw => {
      if(!known.has(norm(raw.id))){
        console.warn('[bus-map] "' + raw.id + '" in _data/ridden_routes.yml matches no route id — check assets/data/bus-routes.geojson for the exact id.');
      }
    });
  }

  function cleanId(id){ return id.replace(/-SBS$/i,' SBS').replace(/\+$/,''); }
  function riddenOf(id){ return RIDDEN.has(norm(id)); }

  const BASE = { ghostWeight: 1.4, ghostOpacity: 0.22, riddenWeight: 5, riddenOpacity: 0.95 };
  const SELECTED = { weight: 7, opacity: 1 };
  const DIMMED_OPACITY = 0.05;

  let selectedId = null;
  let stopMarkersLayer = null;

  function searchQuery(){
    const el = document.getElementById('bm-search');
    return el ? el.value.trim().toLowerCase() : '';
  }
  function matchesSearch(id){
    const q = searchQuery();
    if(!q) return true;
    const r = routesById[id];
    return id.toLowerCase().includes(q) || (r && (r.properties.name||'').toLowerCase().includes(q));
  }
  function normalOpacity(id){
    if(!matchesSearch(id)) return DIMMED_OPACITY;
    return riddenOf(id) ? BASE.riddenOpacity : BASE.ghostOpacity;
  }

  function baseStyle(id){
    const r = routesById[id];
    if(!r || !r._layer) return;
    const on = riddenOf(id);
    const line = r._layer.line;
    line.setStyle({
      color: on ? r.properties.color : GHOST,
      weight: on ? BASE.riddenWeight : BASE.ghostWeight,
      opacity: normalOpacity(id)
    });
    if(on) line.bringToFront();
    const el = line.getElement && line.getElement();
    if(el) el.style.filter = on ? `drop-shadow(0 0 3px ${r.properties.color}99)` : 'none';
  }

  // While a route is selected, every other line fades almost all the way out
  // so the selected one reads in isolation.
  function setOthersDimmed(dim){
    Object.keys(routesById).forEach(id => {
      if(id === selectedId) return;
      const layer = routesById[id]._layer;
      if(!layer) return;
      layer.line.setStyle({opacity: dim ? DIMMED_OPACITY : normalOpacity(id)});
    });
  }

  function renderStopMarkers(id){
    clearStopMarkers();
    const r = routesById[id];
    if(!r || !r.properties.stops || !r.properties.stops.length) return;
    const color = r.properties.color;
    const halo = cssVar('--global-card-bg-color');
    const markers = r.properties.stops.map(s => L.circleMarker([s[0], s[1]], {
      radius: 4, weight: 1.5, color: halo, fillColor: color, fillOpacity: 1, opacity: 1
    }).bindTooltip(s[2], {sticky:true, className:'bm-route-tooltip'}));
    stopMarkersLayer = L.layerGroup(markers).addTo(map);
  }
  function clearStopMarkers(){
    if(stopMarkersLayer){ map.removeLayer(stopMarkersLayer); stopMarkersLayer = null; }
  }

  const detailEl = document.getElementById('bm-detail');
  const listEl = document.getElementById('bm-borough-list');

  function showDetail(id){
    const r = routesById[id];
    if(!r) return;
    const p = r.properties;
    const on = riddenOf(id);
    const meta = BOROUGH_META[p.borough] || BOROUGH_META.other;
    const stops = p.stops || [];
    const story = on ? storyOf(id) : '';
    const stopsHtml = stops.map((s,i) =>
      `<li data-lat="${s[0]}" data-lon="${s[1]}"><span class="bm-stop-num">${i+1}</span><span>${s[2]}</span></li>`
    ).join('');
    detailEl.innerHTML = `
      <button type="button" class="bm-detail-back">&larr; All routes</button>
      <div class="bm-detail-title"><span class="bm-dot" style="background:${meta.color}"></span>${cleanId(p.id)}${on ? '<span class="bm-detail-ridden">Ridden</span>' : ''}</div>
      <div class="bm-detail-sub">${p.name}${stops.length ? ' · ' + stops.length + ' stop' + (stops.length===1?'':'s') : ''}</div>
      ${story ? `<p class="bm-detail-story">${escapeHtml(story)}</p>` : ''}
      ${stops.length ? `<ol class="bm-stop-list">${stopsHtml}</ol>` : '<p class="bm-detail-sub">No stop data for this route.</p>'}
    `;
    detailEl.querySelector('.bm-detail-back').addEventListener('click', clearSelection);
    detailEl.querySelectorAll('.bm-stop-list li').forEach(li => {
      li.addEventListener('click', () => {
        map.panTo([parseFloat(li.dataset.lat), parseFloat(li.dataset.lon)]);
      });
    });
    detailEl.classList.add('show');
    listEl.style.display = 'none';
  }
  function hideDetail(){
    detailEl.classList.remove('show');
    detailEl.innerHTML = '';
    listEl.style.display = '';
  }

  function clearSelection(){
    if(!selectedId) return;
    const prevId = selectedId;
    selectedId = null;
    baseStyle(prevId);
    setOthersDimmed(false);
    clearStopMarkers();
    hideDetail();
    const pill = pillsByRoute[prevId];
    if(pill) pill.classList.remove('selected');
  }

  function selectRoute(id, opts){
    opts = opts || {};
    if(selectedId === id){ clearSelection(); return; }
    clearSelection();
    selectedId = id;
    const r = routesById[id];
    if(r && r._layer){
      const line = r._layer.line;
      line.setStyle({color: r.properties.color, weight: SELECTED.weight, opacity: SELECTED.opacity});
      line.bringToFront();
      const el = line.getElement && line.getElement();
      if(el) el.style.filter = `drop-shadow(0 0 6px ${r.properties.color}cc)`;
      if(opts.pan) map.fitBounds(line.getBounds(), {maxZoom:15, animate:true});
    }
    setOthersDimmed(true);
    renderStopMarkers(id);
    showDetail(id);
    const pill = pillsByRoute[id];
    if(pill) pill.classList.add('selected');
  }

  function buildMap(features){
    features.forEach(f => {
      const p = f.properties;
      const latlngs = f.geometry.coordinates.map(c => [c[1], c[0]]);

      // "line" is purely decorative (interactive:false) so it can never shadow "hit" for
      // pointer events, regardless of which one bringToFront() puts on top visually.
      const line = L.polyline(latlngs, {lineCap:'round', lineJoin:'round', interactive:false}).addTo(map);
      const hit = L.polyline(latlngs, {color:'#000', opacity:0, weight:9}).addTo(map);

      hit.bindTooltip(cleanId(p.id) + ' — ' + p.name, {sticky:true, className:'bm-route-tooltip'});

      hit.on('mouseover', () => {
        if(selectedId) return;
        const on = riddenOf(p.id);
        line.setStyle({opacity: on ? BASE.riddenOpacity : 0.55});
      });
      hit.on('mouseout', () => {
        if(selectedId) return;
        baseStyle(p.id);
      });
      hit.on('click', e => {
        L.DomEvent.stop(e);
        selectRoute(p.id, {pan:false});
      });

      routesById[p.id]._layer = {line, hit};
      baseStyle(p.id);
    });
  }

  map.on('click', () => clearSelection());

  function buildSidebar(features){
    const grouped = {};
    ORDER.forEach(k => grouped[k] = []);
    features.forEach(f => {
      const b = grouped[f.properties.borough] ? f.properties.borough : 'other';
      grouped[b].push(f.properties);
    });

    const list = document.getElementById('bm-borough-list');
    list.innerHTML = '';
    ORDER.forEach(key => {
      const rs = grouped[key];
      if(!rs.length) return;
      const meta = BOROUGH_META[key];
      const on = rs.filter(p => riddenOf(p.id)).length;
      const details = document.createElement('details');
      details.className = 'bm-borough';
      details.open = true;
      details.innerHTML = `
        <summary>
          <span class="bm-name"><span class="bm-chev">&#9656;</span><span class="bm-dot" style="background:${meta.color}"></span>${meta.name}</span>
          <span class="bm-count">${on}/${rs.length}</span>
        </summary>
        <div class="bm-bar"><i style="width:${rs.length ? on/rs.length*100 : 0}%;background:${meta.color}"></i></div>
        <div class="bm-pills"></div>
      `;
      list.appendChild(details);
      const wrap = details.querySelector('.bm-pills');
      rs.sort((a,b) => a.id.localeCompare(b.id, undefined, {numeric:true}));
      rs.forEach(p => {
        const sbs = /SBS/i.test(p.id);
        const onR = riddenOf(p.id);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'bm-pill' + (sbs ? ' sbs' : '') + (onR ? ' on' : '');
        btn.dataset.id = p.id;
        btn.title = onR ? (p.name + ' — ridden') : p.name;
        btn.innerHTML = `<span class="bm-mark"></span>${cleanId(p.id)}`;
        if(onR){ btn.style.background = `var(--${key === 'other' ? 'global-text-color-light' : key})`; }
        btn.addEventListener('click', () => selectRoute(p.id, {pan:true}));
        wrap.appendChild(btn);
        pillsByRoute[p.id] = btn;
      });
    });
  }

  function updateStats(features){
    const total = features.length;
    const count = features.filter(f => riddenOf(f.properties.id)).length;
    document.getElementById('bm-fraction').textContent = count + '/' + total;
    const circ = 2*Math.PI*22;
    document.getElementById('bm-ring').setAttribute('stroke-dashoffset', circ * (1 - (total ? count/total : 0)));
  }

  document.getElementById('bm-search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    Object.keys(pillsByRoute).forEach(id => {
      pillsByRoute[id].classList.toggle('hide', !matchesSearch(id));
      // while a route is selected, everything else is already dimmed for that
      // reason — don't fight it with search-driven opacity changes too.
      if(selectedId) return;
      const layer = routesById[id]._layer;
      if(layer) layer.line.setStyle({opacity: normalOpacity(id)});
    });
    document.querySelectorAll('.bm-borough').forEach(d => { if(q) d.open = true; });
  });

  // keep the map basemap + unridden line color in sync with the site's own dark-mode toggle
  function applyTheme(){
    const dark = isDark();
    map.removeLayer(tileLayer);
    tileLayer = L.tileLayer(TILE_URL[dark ? 'dark' : 'light'], {attribution: ATTRIB, subdomains:'abcd', maxZoom:19}).addTo(map);
    tileLayer.bringToBack();
    GHOST = cssVar('--global-text-color-light');
    Object.keys(routesById).forEach(id => {
      if(riddenOf(id) || id === selectedId) return;
      const layer = routesById[id]._layer;
      if(layer) layer.line.setStyle({color: GHOST});
    });
    if(selectedId) renderStopMarkers(selectedId);
  }
  const lightToggle = document.getElementById('light-toggle');
  if(lightToggle) lightToggle.addEventListener('click', () => setTimeout(applyTheme, 0));
})();
</script>
</div>
